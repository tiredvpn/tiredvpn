# tiredvpn client configuration
# Run: tiredvpn --config /etc/tiredvpn/client.toml
#
# CLI flags override these values. Unknown fields are rejected (strict TOML).

[server]
# Upstream tiredvpn endpoint to connect to.
address = "vpn.example.org"
port = 443

# Same server over IPv6. port_v6 defaults to `port` above.
# address_v6 = "2001:db8::10"
# port_v6 = 443

# --- Several servers: [[servers]] instead of [server] ---
# A lone [server] IS a one-element list, so the two are mutually exclusive:
# setting both is a startup error rather than a guess about which one wins.
# -server / -server-v6 on the command line collapse the list back to one entry.
#
# [[servers]]
# name = "ams"
# address = "203.0.113.10"
# port = 443
# address_v6 = "2001:db8::10"
# weight = 100
#
# [[servers]]
# name = "fra"
# address = "203.0.113.20"
# port = 443
# weight = 50
#
# Each entry may carry its own `secret`: the key is resolved per endpoint and
# travels with the dial, so switching server switches the key with it. -secret /
# TIREDVPN_SECRET is the default for entries that name none. Setting it on some
# entries and not others, with no default configured anywhere, is a startup
# error - that config has no key for half its servers.
#
# [[servers]]
# name = "usa"
# address = "203.0.113.30"
# port = 443
# secret = "the-key-this-server-knows-me-by"

# --- Which server gets dialled, and when it is given up on ---
# [selection]
# policy = "priority"    # priority (list order) | latency | weighted
#
# Address family. Omit it to keep the -prefer-ipv6/-fallback-v4 flags in
# charge; note that -prefer-ipv6=false means v4_only, so prefer_v4 (try IPv4,
# fall back to IPv6) is only reachable from here.
# family = "prefer_v6"   # prefer_v6 | prefer_v4 | v6_only | v4_only
#
# failure_threshold = 2  # failed connect CYCLES before a candidate is parked
# cooldown = "1m"        # first cooldown; doubles per repeat, jittered
# max_cooldown = "30m"   # ceiling for that doubling
# min_dwell = "5m"       # hold a fallback this long before going back
#
# Off by default and worth keeping that way: polling N servers on a timer is a
# periodic fan-out pattern with nothing behind it, which is what a censor
# looks for. With it off, the client learns about a server by dialling it.
# health_check = "off"   # off | active
# recheck_interval = "5m"

[strategy]
# TLS-mimicry transport. Options: reality, grpc, morph, ...
# Optional: omit it (or leave it empty) to let the client pick a strategy.
mode = "reality"

# Optional strategy-specific options (free-form key/value).
# [strategy.options]
# service = "google.firestore.v1.Firestore"

[shaper]
# Behavioural traffic shaper. Use a named preset OR a [shaper.custom] block,
# but not both. Presets are resolved by the shaper registry.
preset = "chrome_browsing"

# Optional ±N% jitter applied to distribution samples; range [0.0, 1.0).
randomization_range = 0.1

# Optional fixed seed for reproducible shaping. Omit for per-session entropy.
# seed = 1234567890

# --- Advanced: custom distributions (mutually exclusive with `preset`) ---
# Comment out `preset` above before enabling [shaper.custom].
#
# [shaper.custom.packet_size]
# type = "histogram"
# [[shaper.custom.packet_size.histogram.bins]]
# value = 64
# weight = 0.2
# [[shaper.custom.packet_size.histogram.bins]]
# value = 1280
# weight = 0.5
# [[shaper.custom.packet_size.histogram.bins]]
# value = 1500
# weight = 0.3
#
# [shaper.custom.inter_arrival]
# type = "lognormal"
# [shaper.custom.inter_arrival.lognormal]
# mu = -4.0
# sigma = 1.2

[tls]
# SNI presented to the upstream — should match the cover hostname.
server_name = "www.cloudflare.com"

# uTLS fingerprint label. See strategy docs for supported values.
fingerprint = "chrome_120"

# ALPN protocols, in preference order.
alpn = ["h2", "http/1.1"]

# Pin a custom CA bundle (PEM). Omit to use system roots.
# ca_cert = "/etc/tiredvpn/ca.pem"

# Disable cert verification — for local testing only. NEVER set in production.
# insecure_skip_verify = false

[logging]
# trace, debug, info, warn, error
level = "info"
# Output format: text or json.
format = "json"
# Destination: stderr, stdout, or a file path.
output = "stderr"
