{{- if include "tiredvpn.client.tun.enabled" . -}}
{{- include "tiredvpn.validate" . -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "tiredvpn.client.tun.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tiredvpn.client.tun.labels" . | nindent 4 }}
spec:
  {{- with .Values.client.tun.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "tiredvpn.client.tun.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tiredvpn.client.tun.selectorLabels" . | nindent 8 }}
        {{- with .Values.client.tun.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.client.tomlConfig }}
        checksum/config: {{ .Values.client.tomlConfig | sha256sum }}
        {{- end }}
        {{- with .Values.client.tun.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "tiredvpn.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "tiredvpn.serviceAccountName" . }}
      hostNetwork: {{ .Values.client.tun.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: tiredvpn
          image: {{ include "tiredvpn.client.tun.image" . }}
          imagePullPolicy: {{ include "tiredvpn.client.tun.imagePullPolicy" . }}
          args:
            {{- include "tiredvpn.client.tun.args" . | nindent 12 }}
          {{- if .Values.client.config.api.enabled }}
          ports:
            - name: api
              containerPort: {{ regexReplaceAll ".*:([0-9]+).*" .Values.client.config.api.listen "${1}" | int }}
              protocol: TCP
              hostPort: {{ regexReplaceAll ".*:([0-9]+).*" .Values.client.config.api.listen "${1}" | int }}
          {{- end }}
          env:
            {{- if not .Values.client.tomlConfig }}
            - name: TIREDVPN_SERVER
              valueFrom:
                secretKeyRef:
                  name: {{ include "tiredvpn.client.secretName" . }}
                  key: {{ include "tiredvpn.client.secretAddressKey" . }}
            - name: TIREDVPN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "tiredvpn.client.secretName" . }}
                  key: {{ include "tiredvpn.client.secretSecretKey" . }}
            {{- end }}
            {{- with .Values.client.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.client.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
            {{- if .Values.client.tomlConfig }}
            - name: config
              mountPath: /etc/tiredvpn/client.toml
              subPath: client.toml
              readOnly: true
            {{- end }}
            {{- with .Values.client.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- if .Values.client.tun.usePrivileged }}
            privileged: true
            {{- else }}
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
            {{- end }}
            runAsUser: 0
            runAsNonRoot: false
          {{- if .Values.client.config.api.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- end }}
          {{- with .Values.client.tun.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        {{- if .Values.client.tomlConfig }}
        - name: config
          configMap:
            name: {{ include "tiredvpn.client.fullname" . }}-config
        {{- end }}
        {{- with .Values.client.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.client.tun.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.client.tun.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.client.tun.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
