{{- if and .Values.server.enabled (not .Values.server.tomlConfig) (not .Values.server.auth.existingSecret) -}}
{{- if or (eq .Values.server.auth.mode "secret") (eq .Values.server.auth.mode "tokens") -}}
{{- include "tiredvpn.validate" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tiredvpn.server.authSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tiredvpn.server.labels" . | nindent 4 }}
type: Opaque
data:
{{- if eq .Values.server.auth.mode "secret" }}
  secret: {{ required "server.auth.secret is required when auth.mode=secret and no existingSecret" .Values.server.auth.secret | b64enc | quote }}
{{- else if eq .Values.server.auth.mode "tokens" }}
  tokens: {{ join "\n" (required "server.auth.tokens is required when auth.mode=tokens and no existingSecret" .Values.server.auth.tokens) | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
