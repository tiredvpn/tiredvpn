version: '3.8'
services:
  tiredvpn-server:
    image: tiredvpn/tiredvpn:latest
    ports:
      - "${TIREDVPN_PORT:-443}:443/tcp"
      - "${TIREDVPN_PORT:-443}:443/udp"
      - "${TIREDVPN_PORT_V6:-995}:995/tcp"
      - "${TIREDVPN_PORT_V6:-995}:995/udp"
    volumes:
      - ./certs:/certs:ro
      - ./configs:/etc/tiredvpn
    command: ["server", "-listen", ":443", "-cert", "/certs/server.crt", "-key", "/certs/server.key", "-secret", "${TIREDVPN_SECRET}"]
    restart: unless-stopped

  # TUN-mode server. Only started with `docker compose --profile tun up`;
  # a plain `docker compose up` leaves it out and runs the proxy server above.
  # Uses the same default image as the proxy service - NAT/forwarding is
  # handled by the binary itself (internal/tun/nat_linux.go), not by the
  # image, so no special TUN-only build is needed.
  tiredvpn-server-tun:
    image: tiredvpn/tiredvpn:latest
    profiles: ["tun"]
    ports:
      - "${TIREDVPN_PORT:-443}:443/tcp"
      - "${TIREDVPN_PORT:-443}:443/udp"
      - "${TIREDVPN_PORT_V6:-995}:995/tcp"
      - "${TIREDVPN_PORT_V6:-995}:995/udp"
    volumes:
      - ./certs:/certs:ro
      - ./configs:/etc/tiredvpn
    # -ip-pool/-tun-ip switch the server into TUN mode. The binary itself
    # auto-enables ip_forward and installs nftables MASQUERADE/FORWARD rules
    # for the given -ip-pool on start (internal/tun/nat_linux.go), so no NAT
    # config is needed here.
    command: ["server", "-listen", ":443", "-cert", "/certs/server.crt", "-key", "/certs/server.key", "-secret", "${TIREDVPN_SECRET}", "-tun-ip", "10.8.0.1", "-ip-pool", "10.8.0.0/24"]
    # These three are mandatory for TUN mode:
    #   cap_add NET_ADMIN — create the tun device + manage nftables/routes
    #   devices /dev/net/tun — expose the host tun char device to the container
    #   sysctls ip_forward — route client traffic between tun and the WAN iface
    cap_add: ["NET_ADMIN"]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls: ["net.ipv4.ip_forward=1"]
    restart: unless-stopped
