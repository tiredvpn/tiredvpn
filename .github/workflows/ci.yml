name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'reports/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'reports/**'
  schedule:
    - cron: '0 0 * * 1' # Weekly security scan

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
      - name: Build
        run: go build ./cmd/tiredvpn/
      - name: Vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Unit Tests with Coverage
        run: |
          go test -race -timeout 5m -short \
            -coverprofile=coverage.out \
            -covermode=atomic \
            ./internal/...

      - name: Coverage Summary
        run: |
          go tool cover -func=coverage.out | tail -1
          echo "---"
          echo "Per-package coverage:"
          go tool cover -func=coverage.out | grep "^github.com" | awk '{print $1}' | \
            sed 's|github.com/tiredvpn/tiredvpn/||' | sort -u | while read pkg; do
              pct=$(go tool cover -func=coverage.out | grep "$pkg" | tail -1 | awk '{print $NF}')
              echo "  $pkg: $pct"
            done

      - name: Upload Coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 30

  integration:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Integration Tests
        run: |
          go test -race -timeout 10m -count=1 -v \
            ./internal/strategy/ \
            ./internal/porthopping/ \
            ./internal/server/ \
            ./internal/mux/

  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Localhost Benchmark
        run: bash scripts/ci-benchmark.sh
        timeout-minutes: 5

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  helm_chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - name: Update dependencies
        run: helm dependency update deploy/helm/tiredvpn
      - name: Lint chart (all ci fixtures)
        run: |
          cd deploy/helm/tiredvpn
          for f in ci/*.yaml; do
            echo "::group::lint $f"
            helm lint . -f "$f"
            echo "::endgroup::"
          done
      - name: Template dry-run (all ci fixtures)
        run: |
          cd deploy/helm/tiredvpn
          for f in ci/*.yaml; do
            echo "::group::template $f"
            helm template release . -f "$f" > /dev/null
            echo "::endgroup::"
          done

  package_check:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      # Build both arch binaries so nfpm-build.sh has its required inputs.
      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o tiredvpn-linux-amd64 ./cmd/tiredvpn/
          GOOS=linux GOARCH=arm64 go build -o tiredvpn-linux-arm64 ./cmd/tiredvpn/

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      # Dry-run the full packaging path (both arch, deb + rpm) to validate
      # nfpm.yaml and the maintainer scripts without publishing anything.
      - name: nfpm package dry-run
        run: |
          echo "::group::nfpm build"
          VERSION=0.0.0-ci bash packaging/nfpm-build.sh
          echo "::endgroup::"

      - name: Shellcheck packaging scripts
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck install.sh packaging/*.sh

      # Best-effort Debian policy lint; not allowed to fail the build.
      - name: Lint .deb (lintian)
        continue-on-error: true
        run: |
          sudo apt-get install -y lintian
          lintian dist/*amd64.deb || true

  vuln_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
        continue-on-error: true

  security_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, test, integration, lint]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (edge)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: tiredvpn/tiredvpn:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
