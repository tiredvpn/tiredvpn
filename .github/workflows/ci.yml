name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'reports/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'reports/**'
  schedule:
    - cron: '0 0 * * 1' # Weekly security scan

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: Build
        run: go build ./cmd/tiredvpn/
      - name: Vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Unit Tests with Coverage
        run: |
          go test -race -timeout 5m -short \
            -coverprofile=coverage.out \
            -covermode=atomic \
            ./internal/...

      - name: Coverage Summary
        run: |
          go tool cover -func=coverage.out | tail -1
          echo "---"
          echo "Per-package coverage:"
          go tool cover -func=coverage.out | grep "^github.com" | awk '{print $1}' | \
            sed 's|github.com/tiredvpn/tiredvpn/||' | sort -u | while read pkg; do
              pct=$(go tool cover -func=coverage.out | grep "$pkg" | tail -1 | awk '{print $NF}')
              echo "  $pkg: $pct"
            done

      - name: Upload Coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 30

  integration:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # -tags=integration_e2e is what makes internal/integration actually run.
      # Without it tunnel_e2e_test.go does not compile into the binary at all,
      # and the package's only other file was covered solely by the -short pass
      # in `test`, which skips its wallclock case. The suite had therefore never
      # run in CI since it was written.
      - name: Integration Tests
        run: |
          # 25m: without -short the server package runs its real-clock and
          # long leg tests too, past 10 min under -race.
          go test -race -timeout 25m -count=1 -v -tags=integration_e2e \
            ./internal/strategy/ \
            ./internal/porthopping/ \
            ./internal/server/ \
            ./internal/mux/ \
            ./internal/integration/

  # Wire-signature detectors. Own job on purpose, because a red here says
  # something specific about the audit rather than about the code in general.
  # The package holds two kinds of test: fingerprints not yet removed, asserted
  # present, and fingerprints already removed, asserted absent alongside a
  # positive control that the matcher still works. So a failure is one of
  # "a marker was removed without moving its test", "a marker came back", or
  # "a matcher went blind" - all three worth reading at a glance.
  wire_signatures:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: On-wire signature detectors
        run: go test -race -timeout 5m -count=1 -v ./internal/wiretest/

  # Tests that touch the real routing table and create links (TestRoot* in
  # internal/tun). They gate themselves on TIREDVPN_NETNS_TESTS=1 plus root,
  # so every other job compiles them and skips them. Here they get what they
  # ask for: root inside a private network namespace that dies with the step,
  # so nothing they add can leak into the runner's own namespace.
  #
  # A skip is a failure here. The helpers skip rather than fail when the host
  # cannot create a dummy or TUN link, and a job that went green on skips would
  # be claiming coverage it does not have. So the step lists every TestRoot*
  # compiled into the binary and requires a top-level PASS line for each one.
  netns_tests:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build test binary
        run: go test -c -o "$RUNNER_TEMP/tun.test" ./internal/tun/

      - name: Load link modules
        run: sudo modprobe dummy && sudo modprobe tun

      - name: Root tests in a private network namespace
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/tun.test"
          log="$RUNNER_TEMP/netns-tests.log"

          # Package init may log to the same stream; keep only test names.
          mapfile -t want < <("$bin" -test.list '^TestRoot' 2>/dev/null |
            grep -E '^TestRoot[A-Za-z0-9_]*$' || true)
          if [ "${#want[@]}" -eq 0 ]; then
            echo "::error::no TestRoot* tests in the binary, nothing would be checked"
            exit 1
          fi
          echo "expecting PASS from ${#want[@]} tests: ${want[*]}"

          set +e
          sudo unshare -n env TIREDVPN_NETNS_TESTS=1 \
            "$bin" -test.run '^TestRoot' -test.v -test.count=1 -test.timeout=5m 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::netns tests failed (exit $rc)"
            exit "$rc"
          fi

          bad=0
          if grep -E -- '--- SKIP' "$log"; then
            echo "::error::netns tests were skipped, see the lines above"
            bad=1
          fi
          for t in "${want[@]}"; do
            if ! grep -qE -- "^--- PASS: ${t} \(" "$log"; then
              echo "::error::${t} did not report PASS"
              bad=1
            fi
          done
          exit "$bad"

  # The relay's upstream keepalive has to work against the exits that run in
  # the field, which are older than it (1.11.8 at the time of writing). These
  # tests put the relay against the real release binary - verification rule 9,
  # a reconstructed "before" proves only the reconstruction - and need both the
  # binary and CAP_NET_ADMIN for the exit's TUN. Without TIREDVPN_OLD_EXIT they
  # skip, so they never ran in CI (P3-14 of the round-9 review). This job
  # downloads the release, checks it against the release's own checksums, and
  # requires a PASS line from each test: a job green on skips claims coverage
  # it does not have.
  old_exit_tests:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    env:
      OLD_EXIT_TAG: v1.11.8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Download the old exit from its release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "$OLD_EXIT_TAG" --repo "$GITHUB_REPOSITORY"             --pattern 'tiredvpn-linux-amd64.tar.gz' --pattern 'checksums.txt'
          grep ' tiredvpn-linux-amd64.tar.gz$' checksums.txt | sha256sum -c -
          tar xzf tiredvpn-linux-amd64.tar.gz
          test -x tiredvpn-linux-amd64
          ./tiredvpn-linux-amd64 -version

      - name: Build test binary
        run: go test -c -o "$RUNNER_TEMP/server.test" ./internal/server/

      - name: Load the tun module
        run: sudo modprobe tun

      - name: The new relay against the old exit, in a network namespace
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/server.test"
          log="$RUNNER_TEMP/old-exit-tests.log"

          mapfile -t want < <("$bin" -test.list '^TestAnOldExit' 2>/dev/null |
            grep -E '^TestAnOldExit[A-Za-z0-9_]*$' || true)
          if [ "${#want[@]}" -eq 0 ]; then
            echo "::error::no TestAnOldExit* tests in the binary, nothing would be checked"
            exit 1
          fi
          echo "expecting PASS from ${#want[@]} tests: ${want[*]}"

          set +e
          # -n, not -rn: a user namespace maps root alone, and the runner's
          # home (750) - where the test binary is - is out of its reach.
          sudo unshare -n sh -c "ip link set lo up &&             TIREDVPN_OLD_EXIT=$RUNNER_TEMP/tiredvpn-linux-amd64             $bin -test.run '^TestAnOldExit' -test.v -test.count=1 -test.timeout=12m" 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::old-exit tests failed (exit $rc)"
            exit "$rc"
          fi

          bad=0
          if grep -E -- '--- SKIP' "$log"; then
            echo "::error::old-exit tests were skipped, see the lines above"
            bad=1
          fi
          for t in "${want[@]}"; do
            if ! grep -qE -- "^--- PASS: ${t} \(" "$log"; then
              echo "::error::${t} did not report PASS"
              bad=1
            fi
          done
          exit "$bad"

  # Tests on real clocks and the kernel's own TCP keepalive, which -short
  # skips: the hang-up of a proxied stream's client has to end the exit's
  # session on its 60 s read deadline, not last as long as the socket (P2-1
  # of the round-10 review, P3-12 of the round-11 review). A PASS line from
  # each is required, as for the old-exit tests.
  real_clock_tests:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # The real-clock hang-up test, and the long leg tests that skip under
      # -short: run together they took the server package past the 5 min
      # budget of the test job and of the release workflow.
      - name: Real-clock and long leg tests
        run: bash scripts/ci-long-tests.sh

  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Localhost Benchmark
        run: bash scripts/ci-benchmark.sh
        timeout-minutes: 5

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not "latest", on purpose. A floating linter is not a gate:
          # golangci-lint 2.13.1 added a check that turned CI red on main with
          # no change of ours, and it did it the day before a tag. Bump this
          # deliberately, in its own commit, with the findings fixed in the same
          # change - not by loosening it back to latest for freshness.
          version: v2.13.1

  helm_chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - name: Update dependencies
        run: helm dependency update deploy/helm/tiredvpn
      - name: Lint chart (all ci fixtures)
        run: |
          cd deploy/helm/tiredvpn
          for f in ci/*.yaml; do
            echo "::group::lint $f"
            helm lint . -f "$f"
            echo "::endgroup::"
          done
      - name: Template dry-run (all ci fixtures)
        run: |
          cd deploy/helm/tiredvpn
          for f in ci/*.yaml; do
            echo "::group::template $f"
            helm template release . -f "$f" > /dev/null
            echo "::endgroup::"
          done

  package_check:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # Build both arch binaries so nfpm-build.sh has its required inputs.
      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o tiredvpn-linux-amd64 ./cmd/tiredvpn/
          GOOS=linux GOARCH=arm64 go build -o tiredvpn-linux-arm64 ./cmd/tiredvpn/

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      # Dry-run the full packaging path (both arch, deb + rpm) to validate
      # nfpm.yaml and the maintainer scripts without publishing anything.
      - name: nfpm package dry-run
        run: |
          echo "::group::nfpm build"
          VERSION=0.0.0-ci bash packaging/nfpm-build.sh
          echo "::endgroup::"

      - name: Shellcheck packaging scripts
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck install.sh packaging/*.sh

      # Best-effort Debian policy lint; not allowed to fail the build.
      - name: Lint .deb (lintian)
        continue-on-error: true
        run: |
          sudo apt-get install -y lintian
          lintian dist/*amd64.deb || true

  vuln_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
        continue-on-error: true

  security_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # kTLS handover tests (TestHandover* in internal/ktls) need the kernel tls
  # module and skip without it, which is how every other job runs them. Here
  # the module is loaded and a skip counts as a failure: the handover depends
  # on unexported crypto/tls fields, and a Go upgrade that moves them must turn
  # something red. The step lists every TestHandover* in the binary and
  # requires a top-level PASS line for each.
  ktls_handover:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build test binary
        run: go test -race -c -o "$RUNNER_TEMP/ktls.test" ./internal/ktls/

      - name: Load kernel TLS
        run: sudo modprobe tls && grep -w '^tls' /proc/modules

      - name: Handover tests on kernel TLS
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/ktls.test"
          log="$RUNNER_TEMP/ktls-handover.log"

          mapfile -t want < <("$bin" -test.list '^TestHandover' 2>/dev/null |
            grep -E '^TestHandover[A-Za-z0-9_]*$' || true)
          if [ "${#want[@]}" -eq 0 ]; then
            echo "::error::no TestHandover* tests in the binary, nothing would be checked"
            exit 1
          fi
          echo "expecting PASS from ${#want[@]} tests: ${want[*]}"

          set +e
          "$bin" -test.run '^TestHandover' -test.v -test.count=1 -test.timeout=5m 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::kTLS handover tests failed (exit $rc)"
            exit "$rc"
          fi

          bad=0
          if grep -E -- '--- SKIP' "$log"; then
            echo "::error::kTLS handover tests were skipped, see the lines above"
            bad=1
          fi
          for t in "${want[@]}"; do
            if ! grep -qE -- "^--- PASS: ${t} \(" "$log"; then
              echo "::error::${t} did not report PASS"
              bad=1
            fi
          done
          exit "$bad"

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, test, integration, lint]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (edge)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: tiredvpn/tiredvpn:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
